[build-system]
requires = ["hatchling<1.26"]
build-backend = "hatchling.build"

[project]
name = "django-octo-qa"
version = "0.2.0"
description = "Unified Django quality assurance and automated test runner (Pytest, Behave BDD, Locust) under Django-Octo."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "jeanpmodev", email = "jeanpmodev@gmail.com" }]
keywords = ["django", "qa", "testing", "pytest", "behave", "bdd", "locust", "octo"]
dependencies = [
    "django>=6.1.2",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "behave>=1.3.3",
    "behave-django>=2.0.0",
    "locust>=2.47.0",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/jeanpmodev/django_octo_qa"
Documentation = "https://django-octo.readthedocs.io/en/latest/qa/"
Repository = "https://github.com/jeanpmodev/django_octo_qa"
Issues = "https://github.com/jeanpmodev/django_octo_qa/issues"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "behave>=1.3.3",
    "behave-django>=2.0.0",
    "locust>=2.47.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_octo_qa"]
include = [
    "src/django_octo_qa/templates/**/*.html",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
